name: smoketest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  schema-validation:
    name: schema validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate plugin.json parses as JSON
        run: python3 -c "import json; json.load(open('.claude-plugin/plugin.json'))"

      - name: Validate marketplace.json parses as JSON
        run: python3 -c "import json; json.load(open('.claude-plugin/marketplace.json'))"

      - name: Validate hooks.json and settings snippet parse as JSON
        run: |
          python3 -c "import json; json.load(open('hooks/hooks.json'))"
          python3 -c "import json; json.load(open('templates/settings-snippet.json'))"

      - name: Validate skills/*/SKILL.md frontmatter (YAML, name, description)
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import glob, re, sys
          import yaml
          files = sorted(glob.glob('skills/*/SKILL.md'))
          if not files:
              print('ERROR: no skills/*/SKILL.md found')
              sys.exit(1)
          bad = 0
          for path in files:
              content = open(path, encoding='utf-8').read()
              m = re.match(r'^---\n(.*?)\n---', content, re.DOTALL)
              if not m:
                  print(f'ERROR: {path} missing YAML frontmatter'); bad += 1; continue
              fm = m.group(1)
              try:
                  data = yaml.safe_load(fm)
              except yaml.YAMLError as e:
                  print(f'ERROR: {path} frontmatter is not valid YAML: {e}'); bad += 1; continue
              for field in ('name:', 'description:'):
                  if not re.search(r'^' + field, fm, re.MULTILINE):
                      print(f'ERROR: {path} frontmatter missing {field}'); bad += 1
              name = re.search(r'^name:\s*(\S+)', fm, re.MULTILINE)
              if name and name.group(1) != path.split('/')[1]:
                  print(f'ERROR: {path} name {name.group(1)!r} does not match its directory'); bad += 1
          print(f'checked {len(files)} SKILL.md files, {bad} problem(s)')
          sys.exit(1 if bad else 0)
          PY

      - name: Validate plugin.json version matches semver
        run: |
          python3 -c "
          import json, re, sys
          v = json.load(open('.claude-plugin/plugin.json'))['version']
          if not re.match(r'^\d+\.\d+\.\d+(-[a-z0-9.]+)?$', v):
              print(f'ERROR: plugin.json version {v} is not valid semver')
              sys.exit(1)
          print(f'OK: version {v} is valid semver')
          "

  markdownlint:
    name: markdown lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli@0.41.0

      - name: Lint all markdown files
        run: |
          markdownlint '**/*.md' --ignore node_modules \
            --disable MD013 MD022 MD024 MD029 MD031 MD032 MD033 MD034 MD038 MD040 MD041 MD056 \
            || (echo 'Markdown lint failed' && exit 1)

  hook-tests:
    name: hook unit tests (v0.5)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Validate hook scripts have valid bash syntax
        run: |
          set -e
          for f in hooks/*.sh hooks/tests/*.sh skills/*/scripts/*.sh; do
            bash -n "$f"
          done
          echo "OK: all hook/test/skill scripts have valid bash syntax"

      - name: Hook and skill scripts are executable in git
        run: |
          bad=$(git ls-files -s -- 'hooks/*.sh' 'hooks/tests/*.sh' 'skills/*/scripts/*.sh' | awk '$1 != "100755" {print $4}')
          if [ -n "$bad" ]; then
            echo "ERROR: not executable in git (run: git update-index --chmod=+x <file>):"
            echo "$bad"
            exit 1
          fi
          echo "OK: all scripts are 100755"

      - name: Plugin hooks put `if` on the hook, not the matcher group, and set a timeout
        run: |
          jq -e '[.hooks[][] | has("if")] | any | not' hooks/hooks.json >/dev/null \
            || { echo "ERROR: 'if' on a matcher group is ignored by Claude Code; put it on the hook object"; exit 1; }
          jq -e '[.hooks[][].hooks[] | has("timeout")] | all' hooks/hooks.json >/dev/null \
            || { echo "ERROR: every hook needs a timeout"; exit 1; }
          echo "OK: hooks.json shape"

      - name: Run hook unit tests
        run: |
          set -e
          bash hooks/tests/test-spec-gate.sh
          bash hooks/tests/test-trigger.sh
          bash hooks/tests/test-review-spec-helpers.sh
